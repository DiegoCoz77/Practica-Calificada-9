<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de pedidos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f6f8}.panel{background:#fff;border:1px solid #dee2e6;border-top:0;padding:20px}.card-link{text-decoration:none}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-3">
 <div class="container"><a class="navbar-brand" href="index.html" id="marca"></a></div>
</nav>
<div class="container pb-4" style="max-width:900px">
 <ul class="nav nav-tabs" id="tabs"></ul>
 <div class="panel" id="app"></div>
</div>
<script>
const C={"caso": "caso5_pedidos", "empresa": "Distribuciones Rápidas del Perú S.A.C.", "sistema": "Sistema de Pedidos y Entregas", "k": "pedidos", "gs": "Gestión de pedidos", "f": ["id_pedido", "id_cliente", "fecha_pedido", "subtotal", "total", "estado_pedido", "observaciones"], "b": [["Registrar", "add"], ["Agregar", "add"], ["Modificar", "mod"], ["Cancelar", "del"]], "tabs": [{"k": "clientes", "n": "Clientes"}, {"k": "productos", "n": "Productos"}, {"k": "pedidos", "n": "Pedidos"}, {"k": "inventario", "n": "Inventario"}, {"k": "repartidores", "n": "Repartidores"}, {"k": "entregas", "n": "Entregas"}, {"k": "seguimiento", "n": "Seguimiento de pedidos"}, {"k": "pagos", "n": "Pagos"}, {"k": "reportes", "n": "Reportes"}]};
const OPT={estado:['Activo','Inactivo'],estado_cita:['Programada','Reprogramada','Atendida','Cancelada'],
 estado_pedido:['Pendiente','En camino','Entregado'],método_pago:['Efectivo','Tarjeta','Yape'],
 rol:['Administrador','Recepcionista','Médico'],tipo_lector:['Estudiante','Docente','Investigador'],
 tipo:['Simple','Doble','Matrimonial','Suite']};
function tp(f){
 if(OPT[f])return'select';
 if(/^id_/.test(f)||/^(precio|stock|cantidad|subtotal|total|monto|tarifa|capacidad|nota|créditos|duración|horas|ingresos|promedio|número|año|cargos)/.test(f))return'number';
 if(f=='hora')return'time';
 if(/^fecha|^periodo$/.test(f))return'date';
 if(/email|correo/.test(f))return'email';
 if(f=='contraseña')return'password';
 if(f=='teléfono')return'tel';
 return'text';
}
function bonito(f){const t=f.replace(/_/g,' ');return t.charAt(0).toUpperCase()+t.slice(1)}
function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const KEY='ps9_'+C.caso+'_'+C.k;
let D=[];try{D=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
let ed=-1,q='';

document.getElementById('marca').textContent=C.empresa+' - '+C.sistema;
document.title=C.gs+' - '+C.empresa;
document.getElementById('tabs').innerHTML=C.tabs.map(t=>`<li class="nav-item"><a class="nav-link${t.k==C.k?' active':''}" href="${t.k}.html">${t.n}</a></li>`).join('');

function draw(){
 const busca=C.b.some(b=>b[1]=='find');
 const cls={add:'success',mod:'warning',del:'danger',find:'primary'};
 document.getElementById('app').innerHTML=`<h5 class="mb-3">${C.gs}</h5>
 <div class="row g-2">${C.f.map((f,j)=>`<div class="col-md-6"><label class="form-label mb-0 small">${bonito(f)}</label>${
  tp(f)=='select'?`<select class="form-select form-select-sm" id="f${j}">${OPT[f].map(o=>`<option>${o}</option>`).join('')}</select>`
  :`<input class="form-control form-control-sm" id="f${j}" type="${tp(f)}" step="any">`}</div>`).join('')}</div>
 <div class="my-3">${C.b.map(b=>`<button class="btn btn-sm btn-${cls[b[1]]} me-1 mb-1" onclick="acc('${b[1]}')">${b[0]}</button>`).join('')}
 <button class="btn btn-sm btn-secondary mb-1" onclick="limpiar()">Limpiar</button></div>
 ${busca?`<div class="input-group input-group-sm mb-3"><span class="input-group-text">Buscar</span><input class="form-control" id="bq" value="${esc(q)}"><button class="btn btn-primary" onclick="acc('find')">Buscar</button></div>`:''}
 <div class="table-responsive"><table class="table table-striped table-bordered table-sm align-middle" id="tt"></table></div>`;
 limpiar();tabla();
}
function limpiar(){
 C.f.forEach((f,j)=>{const e=document.getElementById('f'+j);if(e.tagName=='INPUT')e.value=''});
 const p=document.getElementById('f0');if(p&&p.type=='number')p.value=D.length+1;
 ed=-1;
}
function tabla(){
 const n=Math.min(5,C.f.length);
 let h='<thead class="table-light"><tr>'+C.f.slice(0,n).map(f=>`<th>${bonito(f)}</th>`).join('')+'<th style="width:140px">Acciones</th></tr></thead><tbody>';
 let hay=false;
 D.forEach((row,k)=>{
  if(q&&!row.join(' ').toLowerCase().includes(q.toLowerCase()))return;
  hay=true;
  h+='<tr>'+row.slice(0,n).map((v,j)=>`<td>${C.f[j]=='contraseña'?'••••':esc(v)}</td>`).join('')+
   `<td><button class="btn btn-sm btn-outline-warning me-1" onclick="edt(${k})">Editar</button><button class="btn btn-sm btn-outline-danger" onclick="borrar(${k})">Borrar</button></td></tr>`;
 });
 if(!hay)h+=`<tr><td colspan="${n+1}" class="text-center text-muted">Sin registros</td></tr>`;
 document.getElementById('tt').innerHTML=h+'</tbody>';
}
function leer(){return C.f.map((f,j)=>document.getElementById('f'+j).value)}
function acc(t){
 if(t=='add'){const v=leer();if(!v[0]){alert('Completa el campo '+bonito(C.f[0]));return}D.push(v);q='';guardar();draw()}
 else if(t=='mod'){if(ed<0){alert('Primero elige un registro con el botón Editar');return}D[ed]=leer();q='';guardar();draw()}
 else if(t=='del'){if(ed<0){alert('Primero elige un registro con el botón Editar');return}if(confirm('¿Seguro?')){D.splice(ed,1);q='';guardar();draw()}}
 else{const b=document.getElementById('bq');q=b?b.value:'';tabla()}
}
function edt(k){ed=k;D[k].forEach((v,j)=>document.getElementById('f'+j).value=v)}
function borrar(k){if(confirm('¿Borrar este registro?')){D.splice(k,1);ed=-1;guardar();tabla()}}
draw();
</script>
</body>
</html>
